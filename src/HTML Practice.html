<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edward's Website</title>
</head>
<body>
    <header>
        <h1>Welcome to my website!</h1>
    </header>
    
    <nav>
        <h2>
        <a href="#home"
           target="_self"
           rel="noopener noreferrer">
           <strong>Home</strong></a> | 
        <a href="#about"><strong>About</strong></a> | 
        <a href="#contact"><Strong>Contact</Strong></a>
        </h2>
        <br>
    </nav>
    
    <main>
        <h2>Main Article</h2>
        <p>This is the primary content area of the webpage.</p>
        
        <button>Buy Me</button>
        
        <section style="flex: 2; background: #FCC4A4; padding: 5px;">
            <h2>Our Services</h2>
            <p>We offer high-quality web design and development services.</p>
        </section>
        
        <aside style="flex: 1; background: #D4D4f4; padding: 1px;">
            <h2>Fun Personal Fact</h2>
            <p>I love to learn!</p>
        </aside>

        <img 
            style="height: 300px;"
            src="Images/Chowder.png"
            alt="Chowder Cartoon Network™"
        >
        <br>
        <img
            src="Images/blank.png"
            alt="Blank image"
        >
        <form>
            <label for="email">Email</label>
            <input id="email"
                   type="email"
                   placeholder="Email Address"
                   required
            ><br>
            <label for="phone">Phone Number</label>
            <input id="phone"
                   type="tel"
                   placeholder="###-###-####"
            ><br>
            <label for="text">Text</label>
            <input id="text"
                   type="text"
            >
        </form>
    </main>
    
    <footer>Copyright 2026</footer>
    
</body>
</html>
